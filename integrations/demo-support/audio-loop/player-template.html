<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>循环配乐接入样例</title>
<style>
body { background: #18272e; color: #eff4f0; font: 17px/1.7 system-ui; margin: 40px; }
main { max-width: 850px; margin: auto; }
button { padding: 10px 18px; margin: 8px 8px 8px 0; cursor: pointer; }
fieldset { border: 1px solid #4b686b; border-radius: 12px; margin: 24px 0; padding: 20px; }
label { display: inline-block; margin-right: 24px; }
#status { color: #9cdbbe; min-height: 2em; }
</style>
<main>
<h1>循环配乐接入样例</h1>
<p>选择片段后点击播放。试听接缝从末尾开始，跨到下一轮，默认音量为 25%。</p>
<fieldset><legend>片段</legend>
<label><input type="radio" name="variant" value="direct" checked>直接截取</label>
<label><input type="radio" name="variant" value="crossfade">80ms 交叠候选</label>
</fieldset>
<button id="play">播放循环</button><button id="seam">试听接缝</button>
<button id="stop">停止</button><button id="sfx">叠加短音效</button>
<p><label>音量 <input id="volume" type="range" min="0" max="1" value="0.25" step="0.01"></label></p>
<p id="status" role="status">等待播放</p>
<p>交叠候选会缩短片段 80ms。接缝听感、乐句和场景音效关系需在实际配景时判断。</p>
</main>
<script>
const assets = __ASSETS_JSON__;
let context;
let gain;
let analyser;
let current;
let activeVariant = null;
let playedSfx = 0;
const buffers = {};
function setup() {
  if (context) return;
  context = new AudioContext();
  gain = context.createGain();
  gain.gain.value = Number(document.querySelector('#volume').value);
  analyser = context.createAnalyser();
  gain.connect(analyser);
  analyser.connect(context.destination);
}
function bytes(name) {
  return Uint8Array.from(atob(assets[name].base64), character => character.charCodeAt(0)).buffer;
}
function loopDuration(name) { return assets[name].frames / assets[name].sampleRate; }
async function buffer(name) {
  setup();
  buffers[name] ||= await context.decodeAudioData(bytes(name));
  return buffers[name];
}
function stop() {
  if (current) { current.stop(); current.disconnect(); current = null; }
  activeVariant = null;
  document.querySelector('#status').textContent = '已停止';
}
let playbackRequest = 0;
async function play(seam) {
  const request = ++playbackRequest;
  const variant = document.querySelector('[name=variant]:checked').value;
  const decoded = await buffer(variant);
  await context.resume();
  if (request !== playbackRequest) return;
  stop();
  current = context.createBufferSource();
  current.buffer = decoded;
  current.loop = true;
  current.loopEnd = loopDuration(variant);
  current.connect(gain);
  current.start(0, seam ? Math.max(0, current.loopEnd - 0.25) : 0);
  activeVariant = variant;
  document.querySelector('#status').textContent = `${variant === 'direct' ? '直接截取' : '交叠候选'} · 播放中`;
}
function sfx() {
  setup();
  context.resume();
  const tone = context.createOscillator();
  const envelope = context.createGain();
  tone.type = 'triangle'; tone.frequency.value = 1200;
  envelope.gain.setValueAtTime(0.05, context.currentTime);
  envelope.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.12);
  tone.connect(envelope); envelope.connect(gain);
  tone.start(); tone.stop(context.currentTime + 0.13);
  tone.onended = () => { playedSfx++; tone.disconnect(); envelope.disconnect(); };
}
document.querySelector('#play').onclick = () => play(false).catch(error => { document.querySelector('#status').textContent = error.message; });
document.querySelector('#seam').onclick = () => play(true).catch(error => { document.querySelector('#status').textContent = error.message; });
document.querySelector('#stop').onclick = () => { playbackRequest++; stop(); };
document.querySelector('#sfx').onclick = sfx;
document.querySelector('#volume').oninput = event => { if (gain) gain.gain.value = Number(event.target.value); };
window.addEventListener('pagehide', () => { playbackRequest++; stop(); if (context) context.close(); });
window.audioLab = {
  state() { return {activeVariant, playedSfx, state: context?.state, volume: gain?.gain.value, playing: Boolean(current), looping: current?.loop, loopEnd: current?.loopEnd, bufferDuration: current?.buffer.duration, contextTime: context?.currentTime}; },
  energy() {
    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);
    return Math.sqrt(data.reduce((sum, value) => sum + value * value, 0) / data.length);
  },
  async renderThreeLoops(name) {
    const decoded = await buffer(name);
    const effectiveFrames = Math.round(loopDuration(name) * decoded.sampleRate);
    if (effectiveFrames > decoded.length) throw new Error('Declared loop exceeds decoded signal');
    const offline = new OfflineAudioContext(decoded.numberOfChannels, effectiveFrames * 3, decoded.sampleRate);
    const source = offline.createBufferSource(); source.buffer = decoded; source.loop = true;
    source.loopEnd = loopDuration(name);
    source.connect(offline.destination); source.start(); source.stop(loopDuration(name) * 3);
    const rendered = await offline.startRendering();
    const data = rendered.getChannelData(0);
    let peak = 0; let sum = 0;
    for (const value of data) { peak = Math.max(peak, Math.abs(value)); sum += value * value; }
    return {frames: rendered.length, sampleRate: rendered.sampleRate, decodedFrames: decoded.length, effectiveFrames,
      duration: rendered.duration, peak, rms: Math.sqrt(sum / data.length),
      firstSample: decoded.getChannelData(0)[0], lastEffectiveSample: decoded.getChannelData(0)[effectiveFrames - 1],
      lastDecodedSample: decoded.getChannelData(0)[decoded.length - 1],
      firstSeam: Math.abs(data[effectiveFrames] - data[effectiveFrames - 1]),
      secondSeam: Math.abs(data[effectiveFrames * 2] - data[effectiveFrames * 2 - 1])};
  },
};
</script>
</html>
